<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheets</title><style>/*CSS*/</style></head><body><div id="root"></div>
<script>addEventListener('error',function(e){parent.postMessage({jsonrpc:'2.0',method:'notifications/message',params:{level:'error',logger:'sheets',data:String(e.message)+' (line '+e.lineno+')'}},'*')});addEventListener('unhandledrejection',function(e){parent.postMessage({jsonrpc:'2.0',method:'notifications/message',params:{level:'error',logger:'sheets',data:'unhandled: '+String(e.reason&&e.reason.message||e.reason)}},'*')})</script>
<script>/*ENGINE*/</script><script>/*APP*/</script></body></html>
